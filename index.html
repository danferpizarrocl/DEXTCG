function fromSerial(v){var d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.getUTCFullYear()+"-"+("0"+(d.getUTCMonth()+1)).slice(-2)+"-"+("0"+d.getUTCDate()).slice(-2)}

async function buildXlsx(){
 var zip=await JSZip.loadAsync(TEMPLATE_B64,{base64:true});
 var x=await zip.file("xl/worksheets/sheet1.xml").async("string");
 x=x.replace(/<c r="D(\d+)"([^>]*?) t="b"><v>[01]<\/v><\/c>/g,function(m,r,a){r=+r;if(r<5||r>1029)return m;
   var n=r-4;return '<c r="D'+r+'"'+a+' t="b"><v>'+(isOn(n)?1:0)+'</v></c>'});
 x=x.replace(/<c r="E(\d+)"( s="\d+")[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g,function(m,r,s){r=+r;if(r<5||r>1029)return m;
   var n=r-4;if(isOn(n)){var d=S.caps[n];return '<c r="E'+r+'"'+s+'>'+(d?'<v>'+serial(d)+'</v>':'')+'</c>'}return '<c r="E'+r+'"'+s+'/>'});
 zip.file("xl/worksheets/sheet1.xml",x);
 zip.remove("xl/calcChain.xml");
 var ct=await zip.file("[Content_Types].xml").async("string");
 zip.file("[Content_Types].xml",ct.replace(/<Override[^>]*calcChain[^>]*\/>/,""));
 var rl=await zip.file("xl/_rels/workbook.xml.rels").async("string");
 zip.file("xl/_rels/workbook.xml.rels",rl.replace(/<Relationship [^>]*calcChain[^>]*\/>/,""));
 var wb=await zip.file("xl/workbook.xml").async("string");
 zip.file("xl/workbook.xml",wb.replace(/<calcPr ([^>]*?)\/>/,function(m,a){return /fullCalcOnLoad/.test(a)?m:'<calcPr '+a+' fullCalcOnLoad="1"/>'}));
 return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
async function parseXlsx(buf){
 var zip=await JSZip.loadAsync(buf);
 var wb=await zip.file("xl/workbook.xml").async("string"), rl=await zip.file("xl/_rels/workbook.xml.rels").async("string");
 var m=wb.match(/<sheet [^>]*name="DEX"[^>]*r:id="([^"]+)"/);if(!m)throw new Error("No encuentro la hoja DEX");
 var t=rl.match(new RegExp('<Relationship [^>]*Id="'+m[1]+'"[^>]*Target="([^"]+)"'))||rl.match(new RegExp('<Relationship [^>]*Target="([^"]+)"[^>]*Id="'+m[1]+'"'));
 var path="xl/"+t[1].replace(/^\/?(xl\/)?/,"");
 var x=await zip.file(path).async("string"), caps={}, rx=/<row r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g, r;
 while((r=rx.exec(x))){var row=+r[1];if(row<5||row>1029)continue;var n=row-4;
  var d=r[2].match(new RegExp('<c r="D'+row+'"[^>]*t="b"[^>]*><v>(\\d)</v>'));
  if(d&&d[1]==="1"){var e=r[2].match(new RegExp('<c r="E'+row+'"[^>]*?>(?:<f[^>]*/>|<f[^>]*>[\\s\\S]*?</f>)?<v>([\\d.]+)</v>'));
   caps[n]=e?fromSerial(parseFloat(e[1])):""}}
 return caps;
}
